name: build-image
description: >-
  Build one Bank of Anthos image for linux/amd64 into the runner's Docker, then scan it with Trivy
  (CRITICAL findings that have a fix fail the step). Shared by ci.yml (scan only) and
  cd.yml (scan, then push the same image).
inputs:
  image:
    description: Full image reference, e.g. 255945442255.dkr.ecr.us-east-1.amazonaws.com/merlion/frontend:<sha>
    required: true
  builder:
    description: docker (Dockerfile) or jib (Java services)
    required: true
  context:
    description: Source folder, e.g. src/frontend
    required: true
  trivy-version:
    description: Trivy release
    default: v0.76.2
runs:
  using: composite
  steps:
    - name: Install Trivy
      uses: ./.github/actions/setup-trivy
      with:
        version: ${{ inputs.trivy-version }}

    - name: Set up Docker Buildx
      if: inputs.builder == 'docker'
      uses: docker/setup-buildx-action@v4

    # Reproducible builds: an unchanged service gets the same digest, so a promotion only changes the
    # services that changed (Jib already does this for the Java images). Every timestamp in the image
    # (its creation time and every file's mtime) is set to the last commit that touched the service's
    # folder, instead of the build time. Needs the full Git history (cd.yml checks out with it); in a
    # shallow clone (ci.yml, scan only) it falls back to the current commit.
    - name: Timestamp from the service's last commit
      if: inputs.builder == 'docker'
      id: epoch
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
      run: |
        epoch="$(git log -1 --format=%ct -- "$CONTEXT")"
        if [ "$(git rev-parse --is-shallow-repository)" = true ] || [ -z "$epoch" ]; then
          epoch="$(git log -1 --format=%ct HEAD)"
        fi
        echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

    - name: Build (Dockerfile)
      if: inputs.builder == 'docker'
      uses: docker/build-push-action@v7
      env:
        SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64 # the EKS nodes are x86
        # Into the runner's Docker (as load: true), with every file's mtime set to SOURCE_DATE_EPOCH
        outputs: type=docker,rewrite-timestamp=true
        provenance: false
        tags: ${{ inputs.image }}

    # Upstream has no Dockerfile for the Java services; Jib builds the image from the compiled code
    - name: Set up JDK 17
      if: inputs.builder == 'jib'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    - name: Build (Jib, into the local Docker)
      if: inputs.builder == 'jib'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}
      run: |
        ./mvnw -q -B -pl "$CONTEXT" -am -DskipTests compile jib:dockerBuild \
          -Dimage="$IMAGE" -Djib.from.platforms=linux/amd64

    # The gate: OS packages and language libraries in the final image. Exceptions only through
    # security/.trivyignore (reason, ticket, expiry).
    - name: Trivy image scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        trivy image --scanners vuln --format table \
          --severity CRITICAL --ignore-unfixed --exit-code 1 \
          --ignorefile security/.trivyignore "$IMAGE"
