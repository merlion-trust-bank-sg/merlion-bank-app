# Publish the 9 Bank of Anthos images to ECR, on merge to main and by hand.
#
# Each image is built, then scanned with Trivy (the same gate as ci.yml), and only pushed if the scan
# passes: an image with a CRITICAL finding that has a fix never reaches ECR, even if it got
# onto main. Pushed as g4-merlion-ci-build (GitHub OIDC), tagged with the commit SHA; the digests go
# to the run summary for merlion-bank-infra deploy/values-<env>.yaml.
#
# Run it by hand (Actions -> cd -> Run workflow) after the nightly account cleanup empties ECR.
# The ci-build role trusts only main, so a branch or PR can never publish an image. PRs are checked
# by ci.yml.
#
# Then promotes the new images to staging: a PR in merlion-bank-infra that changes only the digests in
# deploy/values-staging.yaml, opened and merged by the promotion GitHub App once the infra repo's
# required checks pass (no human approval for staging; prod is promoted separately, with one).
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: 255945442255.dkr.ecr.us-east-1.amazonaws.com
  REPO_PREFIX: merlion

# One publish at a time; a newer push to main waits rather than cancelling a build mid-push
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: frontend, builder: docker, context: src/frontend }
          - { image: userservice, builder: docker, context: src/accounts/userservice }
          - { image: contacts, builder: docker, context: src/accounts/contacts }
          - { image: loadgenerator, builder: docker, context: src/loadgenerator }
          - { image: accounts-db, builder: docker, context: src/accounts/accounts-db }
          - { image: ledger-db, builder: docker, context: src/ledger/ledger-db }
          - { image: ledgerwriter, builder: jib, context: src/ledger/ledgerwriter }
          - { image: balancereader, builder: jib, context: src/ledger/balancereader }
          - { image: transactionhistory, builder: jib, context: src/ledger/transactionhistory }
    env:
      IMAGE: 255945442255.dkr.ecr.us-east-1.amazonaws.com/merlion/${{ matrix.image }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Built into the runner's Docker and scanned; a failed scan stops the job before any AWS access
      - name: Build and scan
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.IMAGE }}
          builder: ${{ matrix.builder }}
          context: ${{ matrix.context }}

      # Session name links every push in CloudTrail back to this run
      - name: AWS login (ci-build, push only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::255945442255:role/g4-merlion-ci-build
          role-session-name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      # Pushes exactly the image that was scanned
      - name: Push to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE"

  summary:
    name: digests
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: AWS login (ci-build)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::255945442255:role/g4-merlion-ci-build
          role-session-name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      # The digests of the images this run pushed, for the summary and the promotion PR
      - name: Image digests
        id: digests
        run: |
          json='{}'
          {
            echo "### Images for commit \`${GITHUB_SHA::7}\`"
            echo '```yaml'
            for name in frontend userservice contacts ledgerwriter balancereader transactionhistory \
                        loadgenerator accounts-db ledger-db; do
              digest="$(aws ecr describe-images --repository-name "$REPO_PREFIX/$name" \
                --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
              echo "$name: $digest"
              json="$(jq -c --arg k "$name" --arg v "$digest" '. + {($k): $v}' <<<"$json")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "json=$json" >> "$GITHUB_OUTPUT"

    outputs:
      digests: ${{ steps.digests.outputs.json }}

  # Open (or update) the staging promotion PR in merlion-bank-infra, then merge it once its required
  # checks pass. Acts as the promotion GitHub App: installed on merlion-bank-infra only, with contents
  # and pull requests access; it may merge without an approval but can't skip the required checks.
  promote-staging:
    name: promote to staging
    needs: summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: promote-staging # one promotion at a time; a newer one waits, then supersedes
      cancel-in-progress: false
    env:
      INFRA: merlion-trust-bank-sg/merlion-bank-infra
      BRANCH: promote/staging
      VALUES: deploy/values-staging.yaml
    steps:
      - name: Checkout (for the digest script)
        uses: actions/checkout@v7

      # Valid one hour, merlion-bank-infra only
      - name: Promotion App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: merlion-trust-bank-sg
          repositories: merlion-bank-infra

      - name: Checkout merlion-bank-infra
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA }}
          token: ${{ steps.app.outputs.token }}
          path: infra

      - name: Update the staging digests
        id: update
        env:
          DIGESTS: ${{ needs.summary.outputs.digests }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "$DIGESTS" > "$RUNNER_TEMP/digests.json"
          python3 .github/scripts/update-digests.py "infra/$VALUES" "$RUNNER_TEMP/digests.json"
          cd infra
          if git diff --quiet; then
            echo "Staging already runs these images; nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            # An earlier promotion that never merged would now hold older digests
            pr="$(gh pr list --repo "$INFRA" --head "$BRANCH" --state open --json number --jq '.[0].number')"
            [ -z "$pr" ] || gh pr close "$pr" --repo "$INFRA" --delete-branch \
              --comment "Superseded: main already has the digests from merlion-bank-app ${GITHUB_SHA::7}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # One open promotion PR at most: this force-pushes the branch from main, so the PR always holds
      # exactly the latest digests and nothing else
      - name: Push the promotion branch and open the PR
        if: steps.update.outputs.changed == 'true'
        id: pr
        working-directory: infra
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "Promote merlion-bank-app ${GITHUB_SHA::7} to staging"
          git push --force origin "$BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          body="Promotes [merlion-bank-app@${GITHUB_SHA::7}]($COMMIT_URL) to staging: changes only the image digests in \`$VALUES\`.

          Built, scanned and pushed in [cd run ${GITHUB_RUN_ID}]($RUN_URL). Opened and merged by the promotion App once the required checks pass."
          pr="$(gh pr list --repo "$INFRA" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$INFRA" --base main --head "$BRANCH" \
              --title "Promote merlion-bank-app ${GITHUB_SHA::7} to staging" --body "$body"
            pr="$(gh pr list --repo "$INFRA" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --repo "$INFRA" \
              --title "Promote merlion-bank-app ${GITHUB_SHA::7} to staging" --body "$body"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "Promotion PR: https://github.com/$INFRA/pull/$pr" >> "$GITHUB_STEP_SUMMARY"

      # The infra repo's required checks (checks, plan staging, staging promotion only)
      - name: Wait for the required checks
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # The checks take a few seconds to appear after the push; until then gh reports none
          for _ in $(seq 1 18); do
            [ -n "$(gh pr checks "$PR" --repo "$INFRA" --required --json name --jq '.[].name' 2>/dev/null)" ] && break
            sleep 10
          done
          gh pr checks "$PR" --repo "$INFRA" --required --watch --fail-fast --interval 20

      # As the App: its bypass covers the approval rule only, so a failed check still blocks this.
      # --match-head-commit: never merge digests this run didn't push (a newer run may have updated
      # the branch in the meantime).
      - name: Merge the promotion PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          gh pr merge "$PR" --repo "$INFRA" --merge --match-head-commit "$HEAD" --admin \
            --subject "Promote merlion-bank-app ${GITHUB_SHA::7} to staging (#$PR)"
          echo "Merged: Argo CD rolls staging forward on its next sync of main (within ~3 minutes)." >> "$GITHUB_STEP_SUMMARY"
